<!doctype html>
<html lang="en" data-theme="halcyon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poise: Real-Time Voice Isolator &amp; Background Music Remover</title>
    <meta
      name="description"
      content="Poise is a free, open-source voice isolator that removes music and noise from all system audio in real time. Runs 100% on-device on Windows and Linux."
    />
    <link rel="canonical" href="https://chabandou.github.io/poise-voice-isolator/" />
    <meta name="theme-color" content="#0a111e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Poise" />
    <meta property="og:url" content="https://chabandou.github.io/poise-voice-isolator/" />
    <meta property="og:title" content="Poise: Real-Time Voice Isolator &amp; Background Music Remover" />
    <meta
      property="og:description"
      content="Remove music and noise from everything you hear, in real time. Free, open source, and 100% on-device."
    />
    <meta property="og:image" content="https://chabandou.github.io/poise-voice-isolator/banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="476" />
    <meta property="og:image:alt" content="Poise: Take back control." />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Poise",
        "description": "Free, open-source voice isolator that removes music and noise from all system audio in real time, 100% on-device.",
        "url": "https://chabandou.github.io/poise-voice-isolator/",
        "image": "https://chabandou.github.io/poise-voice-isolator/banner.jpg",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Windows, Linux, Android",
        "downloadUrl": "https://github.com/chabandou/poise-voice-isolator/releases/latest",
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      // Entrance animations may hide content until it scrolls into view;
      // only opt in when JS runs, so the prerendered page stays readable
      // without it (see src/reveal.ts).
      document.documentElement.classList.add('js');
      // Apply the saved colour theme before first paint (see src/themes.ts).
      try {
        var saved = localStorage.getItem('poise-theme');
        if (saved === 'ultraviolet') saved = 'vigil'; // renamed themes
        if (saved === 'mono') saved = 'eclipse';
        if (saved === 'abyss') saved = 'halcyon';
        if (/^(halcyon|verdant|eclipse|vigil|ember|orchid)$/.test(saved)) {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {}
    </script>
    <style>
      /* Zero specificity so the themed index.css background always wins. */
      :where(html, body) {
        background-color: #0a111e;
      }
    </style>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
