name: Windows audio devices
description: >-
  Audio on a GitHub-hosted Windows runner, which has no sound card: the
  audio service, microphone access for desktop apps (WASAPI capture is
  refused without it) and VB-Cable, installed with the vendored setup the
  way Poise's installer runs it.

runs:
  using: composite
  steps:
    - name: Audio service and microphone access
      shell: pwsh
      run: |
        Set-Service Audiosrv -StartupType Automatic
        Start-Service Audiosrv
        foreach ($root in 'HKLM:', 'HKCU:') {
          $key = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
          New-Item -Path "$key\NonPackaged" -Force | Out-Null
          Set-ItemProperty -Path $key -Name Value -Value Allow
          Set-ItemProperty -Path "$key\NonPackaged" -Name Value -Value Allow
        }

    - name: VB-Cable
      shell: pwsh
      run: |
        python installer/fetch_vbcable.py
        if ($LASTEXITCODE) { throw "fetch_vbcable.py failed" }
        $dir = "installer/windows/vbcable"
        $p = Start-Process "$dir/VBCABLE_Setup_x64.exe" -ArgumentList '-i', '-h' -WorkingDirectory $dir -PassThru
        if (-not $p.WaitForExit(180000)) { throw "VB-Cable setup still running after 180 s" }
        "VB-Cable setup exit code: $($p.ExitCode)"
        $deadline = (Get-Date).AddSeconds(30)
        while (-not (Get-PnpDevice -Class AudioEndpoint -FriendlyName 'CABLE Output*' -ErrorAction SilentlyContinue)) {
          if ((Get-Date) -gt $deadline) { throw "no CABLE Output endpoint after the setup" }
          Start-Sleep 1
        }

    - name: Endpoints
      shell: pwsh
      run: ./tools/win_endpoints.ps1 -List
