name: Pulse backend CI

on:
  push:
    branches: [master]
    paths:
      - 'stream_denoiser/**'
      - 'native/**'
      - 'tests/**'
      - 'tools/check_dll_exports.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'build-linux.sh'
      - 'installer/fetch_vbcable.py'
      - 'tools/win_endpoints.ps1'
      - '.github/actions/windows-audio/**'
      - '.github/workflows/pulse-ci.yml'
  # No path filter on PRs: these jobs are required checks on master, and a
  # skipped required check blocks the PR forever.
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libpulse
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - name: Install test deps
        # Runtime deps minus the GUI: stream_denoiser/__init__ pulls in the
        # resampler (samplerate) and the engines (onnxruntime).
        run: |
          grep -v -i pyqt6 requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest pulsectl
      - name: Run unit tests (no server needed)
        run: |
          python -m pytest tests/test_pulse_simple.py tests/test_linux_monitor.py tests/test_health.py -v

  pulseaudio:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    env:
      # The runner mounts /github/home, which root in the container cannot
      # use: PulseAudio then fails to take its autospawn lock.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pulseaudio pulseaudio-utils libpulse0 python3 python3-pip python3-numpy python3-pytest
          test -f /usr/lib/x86_64-linux-gnu/libpulse-simple.so.0 || \
            (echo "libpulse-simple missing" && exit 1)
      - name: Compile the PipeWire node (check only)
        # Ubuntu's libpipewire, another version than Fedora's. Built
        # outside the tree: this job tests the pulse-simple backend.
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc make pkg-config libpipewire-0.3-dev
          make -C native/poise_pw OUT=/tmp/libpoise_pw.so
          test -f /tmp/libpoise_pw.so
      - name: Start headless PulseAudio
        run: |
          pulseaudio --start --exit-idle-time=-1 --disallow-exit
          pactl info
      - name: Install python deps
        run: |
          grep -v -i pyqt6 requirements.txt > /tmp/requirements-ci.txt
          # --ignore-installed: textual needs a newer Pygments than Debian's,
          # which pip cannot uninstall (no RECORD file).
          pip3 install --break-system-packages --ignore-installed -r /tmp/requirements-ci.txt pulsectl pytest
      - name: Unit + integration tests
        run: python3 -m pytest tests/ -v -m "not integration or integration"

  pipewire:
    # Poise's default Linux backend: the PipeWire node (libpoise_pw.so),
    # built here from native/poise_pw and native/core.
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    env:
      HOME: /root
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      SERVER_LOGS: /tmp/server-logs
      # tests/test_pipewire_integration.py fails instead of skipping.
      POISE_REQUIRE_PIPEWIRE_NODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          dnf install -y pipewire pipewire-pulseaudio wireplumber dbus-daemon pulseaudio-utils pulseaudio-libs python3 python3-pip python3-numpy python3-pytest \
            gcc make pkgconf-pkg-config pipewire-devel procps-ng
          test -f /usr/lib64/libpulse-simple.so.0 || \
            (echo "libpulse-simple missing" && exit 1)
      - name: Build the PipeWire node
        run: |
          make -C native/poise_pw
          test -f stream_denoiser/native/libpoise_pw.so || \
            (echo "libpoise_pw.so was not built" && exit 1)
      - name: Start PipeWire with pipewire-pulse
        run: |
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          mkdir -p "$SERVER_LOGS"
          dbus-daemon --session --address="unix:path=$XDG_RUNTIME_DIR/bus" --fork
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          # Each daemon logs to its own file (not to this step's output,
          # which is gone once the step ends), and the file's last line
          # says how it ended: status 128+N is signal N (139: SIGSEGV).
          (set +e; PIPEWIRE_DEBUG=3 pipewire; echo "pipewire exited with status $?") \
            > "$SERVER_LOGS/pipewire.log" 2>&1 &
          sleep 1
          (set +e; wireplumber; echo "wireplumber exited with status $?") \
            > "$SERVER_LOGS/wireplumber.log" 2>&1 &
          (set +e; PIPEWIRE_DEBUG=3 pipewire-pulse; echo "pipewire-pulse exited with status $?") \
            > "$SERVER_LOGS/pipewire-pulse.log" 2>&1 &
          sleep 3
          pactl info
      - name: Install python deps
        run: |
          grep -v -i pyqt6 requirements.txt > /tmp/requirements-ci.txt
          pip3 install -r /tmp/requirements-ci.txt pulsectl pytest
      - name: Unit + integration tests
        run: python3 -m pytest tests/ -v -rs
      - name: Server state after a failure
        if: failure()
        run: |
          ps -eo pid,stat,etime,args | grep -E 'pipewire|wireplumber' | grep -v grep || true
          for f in "$SERVER_LOGS"/*.log; do
            echo "== $f (last 40 lines)"
            tail -n 40 "$f"
          done
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipewire-server-logs
          path: /tmp/server-logs/
          if-no-files-found: warn

  windows:
    # The GUI (Qt offscreen, see tests/conftest.py), the WASAPI bridge on the
    # committed poise_wasapi.dll and the engines, on the platform they ship
    # on. The runner has no audio devices: the hardware tests skip here
    # and run in windows-audio.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests -v

  windows-audio:
    # The hardware tests the windows job skips, on virtual cables: VB-Cable
    # as on a user's machine, Hi-Fi Cable as the playback device
    # (.github/actions/windows-audio). A skip here is a failure.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audio devices
        uses: ./.github/actions/windows-audio
      - name: Install test deps
        run: pip install -r requirements.txt pytest
      - name: Hardware tests
        shell: bash
        env:
          # Moves the default output device's volume: fine on a runner.
          POISE_VOLUME_TESTS: '1'
        run: |
          python -m pytest tests/test_wasapi_integration.py tests/test_volume_mirror.py             tests/test_vbcable_install.py -v -rs | tee "$RUNNER_TEMP/hardware.log"
          ! grep -q SKIPPED "$RUNNER_TEMP/hardware.log"

  native-dll:
    # stream_denoiser/native/poise_wasapi.dll is built by hand and committed.
    # Rebuild it from the sources (the Makefile's default mingw-w64) and fail
    # when the C API has moved on without it.
    runs-on: ubuntu-latest
    # Takes about a minute; a hung apt mirror would otherwise hold it for 6 h.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build poise_wasapi.dll from the sources
        run: make -C native/poise_wasapi OUT="$RUNNER_TEMP/poise_wasapi.dll"
      - name: Compare its exports with the committed DLL
        run: |
          python3 tools/check_dll_exports.py \
            "$RUNNER_TEMP/poise_wasapi.dll" stream_denoiser/native/poise_wasapi.dll
      - name: Upload the fresh build
        uses: actions/upload-artifact@v4
        with:
          name: poise_wasapi-mingw
          path: ${{ runner.temp }}/poise_wasapi.dll
          if-no-files-found: error

  native-dll-bridge:
    # The bridge tests on the DLL native-dll just built, in place of the
    # committed one (the windows job tests that): the sources pass their
    # own tests, not only export the same names.
    needs: native-dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: poise_wasapi-mingw
          path: ${{ runner.temp }}/fresh
      - name: Swap in the fresh build
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP/fresh/poise_wasapi.dll" stream_denoiser/native/poise_wasapi.dll -Force
          git diff --stat
      - name: Install test deps
        shell: bash
        run: |
          grep -v -i pyqt6 requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" pytest
      - name: Bridge tests on the fresh build
        # -rs and a failure on any skip: a DLL that does not load skips
        # the whole module.
        shell: bash
        run: |
          python -m pytest tests/test_wasapi_bridge.py -v -rs | tee "$RUNNER_TEMP/bridge.log"
          ! grep -q SKIPPED "$RUNNER_TEMP/bridge.log"
