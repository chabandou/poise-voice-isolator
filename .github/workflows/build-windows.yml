name: Build Windows installer

# Builds Poise.exe with PyInstaller, compiles the silent Inno core
# (PoiseCore.exe) and wraps it in the PyQt setup window (Poise_Setup.exe)
# on a GitHub-hosted Windows runner. No Windows PC needed: push a tag
# (or click Run workflow) and download the installer from the run's
# artifacts or the GitHub Release.
#
# Triggers:
#   - GitHub web UI -> Actions -> Build Windows installer -> Run workflow
#   - git tag v1.5.0 && git push origin v1.5.0  (also publishes a Release)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to publish GitHub Releases on tags

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        # pyproject.toml is the one version source: the installer takes
        # it from here, and a release tag must match it (the in-app
        # updater compares the tag with the version the app reports).
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.Substring(1)
            if ($tag -ne $version) {
              Write-Error "Tag v$tag does not match pyproject.toml version $version"
              exit 1
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip list | Select-String -Pattern "onnxruntime|PyQt6|sounddevice|pyinstaller"

      - name: Stage VB-Cable driver
        run: python installer/fetch_vbcable.py

      - name: Build Poise.exe (PyInstaller)
        run: pyinstaller poise_windows.spec --noconfirm

      - name: Verify app bundle
        run: |
          if (-not (Test-Path "dist/Poise/Poise.exe")) {
            Write-Error "dist/Poise/Poise.exe missing after PyInstaller build"
            exit 1
          }
          Get-ChildItem dist/Poise | Format-Table Name, Length

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer core (Inno Setup)
        # The core is the silent engine behind Poise_Setup.exe: it still
        # owns files, shortcuts, the uninstaller and the driver.
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DCORE /DMyAppVersion=${{ steps.version.outputs.version }} setup.iss'

      - name: Verify installer core
        run: |
          if (-not (Test-Path "installer/PoiseCore.exe")) {
            Write-Error "installer/PoiseCore.exe missing after ISCC compile"
            exit 1
          }
          Get-Item installer/PoiseCore.exe | Format-Table Name, Length

      - name: Build setup window (PyInstaller)
        # Produces installer/Poise_Setup.exe with PoiseCore.exe embedded.
        run: pyinstaller installer/PoiseSetup.spec --noconfirm --distpath installer --workpath build/installer

      - name: Verify installer
        run: |
          if (-not (Test-Path "installer/Poise_Setup.exe")) {
            Write-Error "installer/Poise_Setup.exe missing after PyInstaller build"
            exit 1
          }
          Get-Item installer/Poise_Setup.exe | Format-Table Name, Length

      - name: Checksum update core
        # The in-app updater downloads PoiseCore.exe and runs it silently
        # (stream_denoiser/updates.py); the name is its contract. It
        # prefers GitHub's asset digest, this file is the fallback.
        run: |
          $hash = (Get-FileHash installer/PoiseCore.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path installer/PoiseCore.exe.sha256 -Value "$hash  PoiseCore.exe" -Encoding ascii -NoNewline
          Get-Content installer/PoiseCore.exe.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poise_Setup
          path: installer/Poise_Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        # A draft until build-linux.yml has attached its binary too.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          bash tools/release_upload.sh "$GITHUB_REF_NAME"
          installer/Poise_Setup.exe
          installer/PoiseCore.exe
          installer/PoiseCore.exe.sha256
