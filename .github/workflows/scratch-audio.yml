name: scratch audio probe

on:
  push:
    branches: [ci/windows-hardware-ci]
    paths: ['.github/workflows/scratch-audio.yml']

jobs:
  audio:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audio service and microphone consent
        run: |
          Set-Service Audiosrv -StartupType Automatic
          Start-Service Audiosrv
          Get-Service Audiosrv, AudioEndpointBuilder | Format-Table Name, Status
          foreach ($root in 'HKLM:', 'HKCU:') {
            $key = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path "$key\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path $key -Name Value -Value Allow
            Set-ItemProperty -Path "$key\NonPackaged" -Name Value -Value Allow
          }
      - name: Stage VB-Cable
        run: python installer/fetch_vbcable.py
      - name: Install VB-Cable
        timeout-minutes: 5
        run: |
          $dir = "installer/windows/vbcable"
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($cat in Get-ChildItem $dir -Filter *.cat) {
            $sig = Get-AuthenticodeSignature $cat.FullName
            "$($cat.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          $cert = (Get-AuthenticodeSignature (Get-ChildItem $dir -Filter *.cat | Select-Object -First 1).FullName).SignerCertificate
          $cer = "$env:RUNNER_TEMP\vbaudio.cer"
          [IO.File]::WriteAllBytes($cer, $cert.Export('Cert'))
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $p = Start-Process "$dir/VBCABLE_Setup_x64.exe" -ArgumentList '-i','-h' -Wait -PassThru -WorkingDirectory $dir
          "setup exit code: $($p.ExitCode)"
          Start-Sleep 5
          Get-PnpDevice -Class MEDIA | Format-Table Status, FriendlyName, InstanceId -AutoSize
          Get-PnpDevice -Class AudioEndpoint | Format-Table Status, FriendlyName -AutoSize
      - name: Endpoints after setup
        run: ./tools/win_endpoints.ps1 -List
      - name: Hi-Fi Cable as the output device
        timeout-minutes: 6
        run: |
          $zip = "$env:RUNNER_TEMP\hificable.zip"
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/HiFiCableAsioBridgeSetup_v1007.zip -OutFile $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash
          $dir = "$env:RUNNER_TEMP\hificable"
          Expand-Archive $zip -DestinationPath $dir
          Get-ChildItem -Recurse $dir | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          foreach ($cat in Get-ChildItem -Recurse $dir -Filter *.cat) {
            $sig = Get-AuthenticodeSignature $cat.FullName
            "$($cat.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          Get-ChildItem -Recurse $dir -Filter *win10*.inf | ForEach-Object { "== $($_.Name)"; Select-String -Path $_.FullName -Pattern 'HardwareId|NAME' | ForEach-Object Line }
          $setup = Get-ChildItem -Recurse $dir -Filter *Setup*x64*.exe | Select-Object -First 1
          if (-not $setup) { $setup = Get-ChildItem -Recurse $dir -Filter *.exe | Select-Object -First 1 }
          "setup: $($setup.FullName)"
          $p = Start-Process $setup.FullName -ArgumentList '-i','-h' -PassThru -WorkingDirectory $setup.DirectoryName
          if (-not $p.WaitForExit(180000)) { "setup still running after 180 s"; Stop-Process $p -Force } else { "setup exit code: $($p.ExitCode)" }
          Start-Sleep 5
          Get-PnpDevice -Class MEDIA | Format-Table Status, Problem, FriendlyName, InstanceId -AutoSize
          ./tools/win_endpoints.ps1 -List
      - name: Install deps
        run: pip install -r requirements.txt pytest
      - name: List devices
        run: python -c "import sounddevice as sd; print(sd.query_devices()); print(sd.query_hostapis())"
      - name: Hardware tests
        env:
          POISE_VOLUME_TESTS: '1'
        run: python -m pytest tests/test_wasapi_integration.py tests/test_volume_mirror.py tests/test_vbcable_install.py -v -rs
