name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - safu/website
    paths:
      - 'website/**'
  pull_request:
    branches:
      - master
      - safu/website
    paths:
      - 'website/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./website
        run: npm install

      - name: Build project
        working-directory: ./website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  health-check:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Check site availability
        run: |
          echo "Checking site..."
          for i in {1..5}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://chabandou.github.io/poise-voice-isolator/)
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Site is live!"
              exit 0
            fi
            echo "⏳ Retry $i..."
            sleep 5
          done
          echo "❌ Site is not responding"
          exit 1